[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uuls"
version = "0.1.0"
description = "Upper limits on gamma-ray counterparts of GW events under source uncertainty"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["uuls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than ~30 s", "simulst: needs the simulst env and offline data"]
