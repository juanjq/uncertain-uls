# S250328ae: 90% area 14 deg2, about 0.7 LST fields of 2.5 deg radius, peak (145.2, +11.0),
# distance 511 ± 82 Mpc (skymap header). Simulated LST-1 data on a tilepy 2D tiling.
# The merger time is moved to the first dark time after `after` with the skymap peak
# below 40 deg zenith; the skymap is not rotated.
name: sim_tiling
gw:
  skymap: S250328ae.fits     # copied into data/gw/skymaps/
  pe: null                   # no standardized PE for this event in data/gw/pe_standardized yet
t0:
  mode: observable
  after: "2025-03-01T00:00:00"   # S250328ae peak observable from La Palma (alt 72 deg, Sun -61 deg)
  max_zenith: 40
  target: peak
data:
  kind: simulst
  nsb: 0.14
  seed: 2
pointings:
  strategy: tilepy
  start_delay: 60            # s from t0 to the first run
  window: null               # h after the first run; null = tilepy's maxNights
  settings:                  # overrides of uuls.pointings.TILEPY_LST1
    maxRuns: 20
    duration: 20             # min
    maxZenith: 55            # deg; simulst refuses runs at zenith >= 60 deg (plan §10.4)
    FOV: 2.0                 # deg, radius of the disc tilepy counts per tile. It follows the usable
                             # exposure radius of the simulst IRFs: raise it to 2.5 once simulst
                             # gives exposure to 2.5 deg offset (plan §10.1)
    moonDown: 90             # the Moon is not a constraint: the simulation's NSB is set by data.nsb
analysis:
  center: auto               # single-geometry analysis (10 x 14 deg here); the tiling is analysed
  width: auto                # field by field instead, see uuls.fields
  margin: 2.5
  fields:                    # uuls.fields: one geometry per group of pointings
    link_deg: 1.0            # pointings closer than this share a field (a wobble set is one field)
  reduce:                    # overrides of uuls.reduce.DEFAULT_SETTINGS
    background: fov          # run background model, one normalisation per run fitted to the counts;
                             # "ring" (reference) is kept selectable for comparison (plan §10.2)
